<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Clarence Neil Meneses</title>
  <desc id="d">Full-stack developer. Building booking, operations and analytics systems. Now: Malaya Villas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15110E"/><stop offset="1" stop-color="#1E1813"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E3A35E" stop-opacity="0.22"/><stop offset="1" stop-color="#E3A35E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>
  <style>
    .serif { font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
    .sans  { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; }
    .mono  { font-family: Consolas, Menlo, 'Courier New', monospace; }
    @keyframes pulse { 0%, 100% { opacity: .25; r: 7px; } 50% { opacity: 0; r: 15px; } }
    .ring { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-60px, 26px); } }
    .glow { animation: drift 18s ease-in-out infinite; }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <circle class="glow" cx="1010" cy="70" r="300" fill="url(#glow)"/>
    <g stroke="#F4EDE3" stroke-opacity="0.07">
      <path d="M100 0V360"/><path d="M200 0V360"/><path d="M300 0V360"/><path d="M400 0V360"/><path d="M500 0V360"/><path d="M600 0V360"/><path d="M700 0V360"/><path d="M800 0V360"/><path d="M900 0V360"/><path d="M1000 0V360"/><path d="M1100 0V360"/>
      <path d="M0 120H1200"/><path d="M0 240H1200"/>
    </g>
    <text x="72" y="92" class="mono" font-size="15" letter-spacing="3" fill="#E3A35E">FULL-STACK DEVELOPER · BATANGAS, PH</text>
    <text x="70" y="168" class="serif" font-size="64" fill="#F4EDE3">Clarence Neil Meneses</text>
    <text x="72" y="216" class="sans" font-size="21" fill="#B9A994">I build the booking, operations and analytics systems</text>
    <text x="72" y="246" class="sans" font-size="21" fill="#B9A994">that small businesses run on every day.</text>
    <rect x="72" y="282" width="390" height="42" rx="21" fill="#2A211A" stroke="#E3A35E" stroke-opacity="0.45"/>
    <circle class="ring" cx="98" cy="303" r="7" fill="#3FB970"/>
    <circle cx="98" cy="303" r="5" fill="#3FB970"/>
    <text x="116" y="309" class="sans" font-size="16" fill="#F4EDE3"><tspan font-weight="600">Now</tspan><tspan fill="#7D6E5E">  ·  </tspan>building Malaya Villas' booking system</text>
    <text x="1128" y="309" text-anchor="end" class="mono" font-size="14" fill="#7D6E5E">BSIT · Business Analytics · BatStateU '26</text>
  </g>
</svg>
